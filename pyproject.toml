[project]
name = "doctovid"
version = "2.0.0"
description = "Telegram bot that makes videos sent as files playable, and renames or re-thumbnails any file."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "cryptg>=0.6",
    "python-dotenv>=1.2",
    "telethon>=1.45",
    "tzdata>=2025.2",
]

[project.scripts]
doctovid = "doctovid.__main__:main"
doctovid-media = "doctovid.worker:main"

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "PL"]
# ASYNC240: the only blocking path calls here are single stat()s and unlinks,
# which take microseconds; wrapping each in a thread would cost more.
ignore = ["PLR0913", "PLR2004", "PLR0911", "ASYNC240"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# In parallel across every core. `-n0` runs in one process, for a debugger.
addopts = "-n auto"
