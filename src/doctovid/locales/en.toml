new_name = "New name: <b>{name}</b>"
playable_name = "<i>Made playable, it will be called {name}.</i>"
thumbnail = "Thumbnail: your picture"
question = "What should I do with it?"
make_playable = "▶️ Make playable"
send_file = "📄 Send as file"
rename = "✏️ Rename"
add_thumbnail = "🖼 Thumbnail"
change_thumbnail = "🖼 Change thumbnail"
remove_thumbnail = "🗑 Remove thumbnail"
cancel = "✖️ Cancel"
cancelled = "✖️ Cancelled."
expired = "⌛ This menu expired. Send the file again if you still need it."
expired_alert = "This menu has expired. Send the file again."
replaced = "✏️ You replaced the file in that message, so this menu is closed. Send the new file as a new message."
thumbnail_removed = "Thumbnail removed."
busy = "One moment: I'm still applying your change to this file."
rename_prompt = """Send the new name for <b>{name}</b>.
Leave off the extension to keep it, or type one to change it."""
