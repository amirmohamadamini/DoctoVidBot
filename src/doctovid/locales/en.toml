# English: the reference every other language is checked against.
#
# The bot fills in the {placeholders}. A translation keeps every placeholder
# and every <b>/<i> tag, and can reword everything else freely. A message with
# plural forms is a table of them: see PLURALS in i18n.py for the forms each
# language needs.

[language]
name = "English"
direction = "ltr"
digits = "0123456789"
decimal = "."
choose = "🌐 Choose your language"
chosen = "✅ The bot will speak English with you."

[unit]
size = "{value} {unit}"
b = "B"
kb = "KB"
mb = "MB"
gb = "GB"
percent = "{value}%"
speed = "{size}/s"
minutes = { one = "{count} min", other = "{count} min" }
hours = { one = "{count} h", other = "{count} h" }
days = { one = "{count} day", other = "{count} days" }
pair = "{first} {second}"

[keyboard]
help = "❓ Help"
usage = "📊 My usage"
language = "🌐 Language"
admin = "🛠 Admin panel"
placeholder = "Send a file…"

[command]
start = "Show the menu"

[start]
welcome = """<b>Send me a video as a file</b> and I'll send it back as a video you can play right here in Telegram.

I can also rename any file, change its extension, or give it a new thumbnail.

Files up to {size}. Tap {help} below for details."""
cache_note = "<i>Videos sent back without a new name or thumbnail are kept in a private channel, so the same file comes back instantly next time.</i>"
nudge = "👋 Send me a file, or tap {help}."

[help]
text = """<b>How it works</b>

1. Send a file. For a video, send it <b>as a file</b> (in the attach menu, choose File).
2. Pick what to do with it:
   <b>Make playable</b>: for videos. Telegram only plays MP4 inline. A video that is already a playable MP4 is sent straight back; an MKV, AVI, WebM and so on is repacked into MP4 without re-encoding, so the quality is unchanged and it takes seconds.
   <b>Send as file</b>: returns the file untouched, with any new name or thumbnail.
   <b>Rename</b>: type a new name. Add an extension to change it too.
   <b>Thumbnail</b>: send a photo to use as the cover.
3. If other files are ahead of yours, you'll see your place in the queue.

Videos that would need re-encoding (for example VP9) can't be made playable, but can still be renamed or given a thumbnail.

There is a daily and a monthly limit on how many files, and how much data, each person can send. Tap {usage} to see where you are."""
admin_note = "You're an admin: tap {admin} for the admin panel."

