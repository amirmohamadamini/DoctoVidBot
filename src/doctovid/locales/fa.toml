# Persian (فارسی). Right to left, with Persian digits.
#
# Keep every {placeholder} and every <b>/<i> tag; see en.toml. A noun after a
# number stays singular in Persian, so plural messages have one form, "other".

[language]
name = "فارسی"
direction = "rtl"
digits = "۰۱۲۳۴۵۶۷۸۹"
decimal = "٫"
choose = "🌐 زبان خود را انتخاب کنید"
chosen = "✅ از این به بعد ربات با شما فارسی صحبت می‌کند."

[unit]
size = "{value} {unit}"
b = "بایت"
kb = "کیلوبایت"
mb = "مگابایت"
gb = "گیگابایت"
percent = "{value}٪"
speed = "{size} در ثانیه"
minutes = { other = "{count} دقیقه" }
hours = { other = "{count} ساعت" }
days = { other = "{count} روز" }
pair = "{first} و {second}"

[keyboard]
help = "❓ راهنما"
usage = "📊 میزان استفاده"
language = "🌐 زبان"
admin = "🛠 پنل مدیریت"
placeholder = "یک فایل بفرستید…"

[command]
start = "نمایش منو"

[start]
welcome = """<b>ویدیوی خود را به صورت فایل بفرستید</b> تا آن را به شکل ویدیویی برگردانم که همین‌جا در تلگرام پخش شود.

نام هر فایلی را هم می‌توانم عوض کنم، پسوندش را تغییر دهم یا برایش کاور تازه بگذارم.

حداکثر حجم فایل: {size}. برای توضیحات بیشتر، {help} را در پایین بزنید."""
cache_note = "<i>ویدیوهایی که بدون نام یا کاور تازه برگردانده می‌شوند در یک کانال خصوصی نگه داشته می‌شوند تا دفعهٔ بعد همان فایل فوراً برگردد.</i>"
nudge = "👋 یک فایل برایم بفرستید، یا {help} را بزنید."

[help]
text = """<b>روش کار</b>

۱. یک فایل بفرستید. ویدیو را <b>به صورت فایل</b> بفرستید (در منوی پیوست، گزینهٔ «فایل» را بزنید).
۲. انتخاب کنید با آن چه کنم:
   <b>قابل پخش کن</b>: برای ویدیوها. تلگرام فقط MP4 را داخل گفت‌وگو پخش می‌کند. ویدیویی که از قبل MP4 قابل پخش باشد همان‌طور برمی‌گردد. MKV، AVI، WebM و مانند آن‌ها بدون انکود دوباره در قالب MP4 بسته‌بندی می‌شوند، پس کیفیت همان می‌ماند و چند ثانیه بیشتر طول نمی‌کشد.
   <b>ارسال به صورت فایل</b>: فایل را دست‌نخورده برمی‌گرداند، با نام یا کاور تازه اگر گذاشته باشید.
   <b>تغییر نام</b>: نام تازه را بنویسید. اگر پسوند هم بنویسید، پسوند هم عوض می‌شود.
   <b>کاور</b>: یک عکس بفرستید تا کاور فایل شود.
۳. اگر فایل‌های دیگری جلوتر از فایل شما باشند، جایگاهتان را در صف می‌بینید.

ویدیوهایی که به انکود دوباره نیاز دارند (مثلاً VP9) قابل پخش نمی‌شوند، ولی می‌توانید نامشان را عوض کنید یا برایشان کاور بگذارید.

هر نفر سقفی روزانه و ماهانه برای تعداد فایل‌ها و حجم آن‌ها دارد. برای دیدن وضعیت خود {usage} را بزنید."""
admin_note = "شما مدیر هستید: برای پنل مدیریت {admin} را بزنید."

